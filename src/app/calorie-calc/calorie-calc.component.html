<div class="calorie-container">
  <h2>Calorie Calculator</h2>
  <p>Fill in your details to estimate your daily caloric needs.</p>

  <div class="calorie-card">
    <form class="calorie-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Sex</label>
        <div class="radio-group">
          <label class="radio-option">
            <input
              type="radio"
              name="sex"
              value="female"
              formControlName="sex"
            />
            Female
          </label>
          <label class="radio-option">
            <input type="radio" name="sex" value="male" formControlName="sex" />
            Male
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input
          type="number"
          id="age"
          placeholder="e.g. 25"
          min="1"
          max="100"
          formControlName="age"
        />
      </div>

      <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input
          type="number"
          id="weight"
          placeholder="e.g. 70"
          min="1"
          max="200"
          formControlName="weight"
        />
      </div>

      <div class="form-group">
        <label for="height">Height (cm)</label>
        <input
          type="number"
          id="height"
          placeholder="e.g. 175"
          min="1"
          max="220"
          formControlName="height"
        />
      </div>

      <button type="submit" class="submit-btn">Calculate</button>
    </form>
  </div>
</div>
