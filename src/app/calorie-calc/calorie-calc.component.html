<div class="calorie-container">
  <div>
    <h2>Calorie Calculator</h2>
    <p>Fill in your details to estimate your daily caloric needs.</p>

    <div class="calorie-card">
      <form class="calorie-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Sex</label>
          <div class="radio-group">
            <label class="radio-option">
              <input
                type="radio"
                name="sex"
                value="female"
                formControlName="sex"
              />
              Female
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="sex"
                value="male"
                formControlName="sex"
              />
              Male
            </label>
          </div>
          <span class="error-message">{{ getError("sex") }}</span>
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input
            type="number"
            id="age"
            placeholder="e.g. 25"
            min="1"
            max="100"
            formControlName="age"
          />
          <span class="error-message">{{ getError("age") }}</span>
        </div>

        <div class="form-group">
          <label for="weight">Weight (kg)</label>
          <input
            type="number"
            id="weight"
            placeholder="e.g. 70"
            min="1"
            max="200"
            formControlName="weight"
          />
          <span class="error-message">{{ getError("weight") }}</span>
        </div>

        <div class="form-group">
          <label for="height">Height (cm)</label>
          <input
            type="number"
            id="height"
            placeholder="e.g. 175"
            min="1"
            max="220"
            formControlName="height"
          />
          <span class="error-message">{{ getError("height") }}</span>
        </div>
        <div class="form-group">
          <label for="activity">Activity Level</label>
          <select id="activity" formControlName="activity" required>
            <option value="" disabled selected>
              Select your activity level
            </option>
            <option value="1.2">Sedentary (little or no exercise)</option>
            <option value="1.375">
              Lightly active (light exercise/sports 1-3 days/week)
            </option>
            <option value="1.55">
              Moderately active (moderate exercise/sports 3-5 days/week)
            </option>
            <option value="1.725">
              Very active (hard exercise/sports 6-7 days a week)
            </option>
            <option value="1.9">
              Extra active (very hard exercise/sports & physical job)
            </option>
          </select>
          <span class="error-message">{{ getError("activity") }}</span>
        </div>
        <div class="form-group">
          <label>Your goal</label>
          <div class="radio-group">
            <label class="radio-option">
              <input
                type="radio"
                name="goal"
                value="lose"
                formControlName="goal"
              />
              Lose Weight
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="goal"
                value="maintain"
                formControlName="goal"
              />
              Maintain Weight
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="goal"
                value="gain"
                formControlName="goal"
              />
              Gain Weight
            </label>
          </div>
          <span class="error-message">{{ getError("goal") }}</span>
        </div>
        <button type="submit" class="submit-btn" [disabled]="disabledBtn">
          Calculate
        </button>
      </form>
    </div>
  </div>
  @if(result()) {
    <app-calc-result [calories]="result()"></app-calc-result>
  }

  
</div>
